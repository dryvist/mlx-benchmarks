[project]
name = "mlx-benchmarks"
version = "0.25.2"  # x-release-please-version
description = "Benchmark harness for MLX-quantized LLMs on Apple Silicon — envelope v1 + HF dataset publisher"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
authors = [{ name = "Jacob Evans" }]
keywords = ["mlx", "benchmarks", "lm-eval", "llm", "apple-silicon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "huggingface-hub>=1.28.0",
    "jsonschema[format]>=4.26.0",
    "psutil>=7.2.2",
    "pyarrow>=25.0.1",
    # tokenizers powers the lm-eval converter's tok/s computation. The lm-eval
    # PACKAGE is not a dependency — mlx-benchmarks only parses lm-eval's JSON
    # output — so tokenizers is declared here as the direct dependency it is.
    "tokenizers>=0.23.1",
]

[project.optional-dependencies]
# Note: the standalone agent-eval scripts under harness/framework-eval/ declare
# their own deps via PEP 723 inline metadata (run with `uv run`), and the HF
# Space (space/app.py) installs from space/requirements.txt — so neither needs
# an extra here.
# `dev` is consumed by the org reusable Python CI via `uv run --extra dev`
# (lint/format/type/test gate). It lives here as an optional-dependencies
# extra — NOT a PEP 735 [dependency-groups] table — because `uv run --extra`
# only resolves optional-dependencies.
dev = [
    "pyright>=1.1.411",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "types-jsonschema",
    "types-psutil",
]
# Note: vllm benchmarking targets an external vllm server. The vllm Python
# package itself is Linux/CUDA-only, isn't installable on the Apple-Silicon
# dev platform, and isn't needed by the converter (which only parses JSON
# output). To run vllm `benchmark_serving`, install vllm in your own env.

[project.scripts]
mlx-bench-publish = "mlx_benchmarks.cli:main"
mlx-bench-events = "mlx_benchmarks.events:main"
mlx-bench-shootout = "mlx_benchmarks.shootout:main"

[project.urls]
Homepage = "https://github.com/JacobPEvans/mlx-benchmarks"
Dataset  = "https://huggingface.co/datasets/JacobPEvans/mlx-benchmarks"
Issues   = "https://github.com/JacobPEvans/mlx-benchmarks/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_benchmarks"]

# Ship schema.json inside the installed package dir (NOT a shared-data path),
# so `mlx_benchmarks.envelope._find_schema_path()` resolves it via
# `importlib.resources.files("mlx_benchmarks") / "schema.json"` after pip install.
[tool.hatch.build.targets.wheel.force-include]
"schema.json" = "mlx_benchmarks/schema.json"

[tool.hatch.build.targets.sdist]
include = [
    "src/mlx_benchmarks/**",
    "schema.json",
    "examples/**",
    "tests/**",
    "scripts/**",
    "configs/**",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "PIE",  # flake8-pie
    "PTH",  # flake8-use-pathlib
    "C4",   # flake8-comprehensions
    "ARG",  # unused arguments
]
ignore = [
    "E501",  # line length — ruff format handles it; avoids noise on URLs/long strings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]  # fixtures often accept unused args

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
# pyright is the org-mandated type checker (replaced mypy 2026-06). It runs from
# the project venv via .pre-commit-config.yaml so the dev-deps above are the
# single version authority.
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
include = ["src/mlx_benchmarks"]
typeCheckingMode = "standard"
# Several runtime deps ship no type stubs (huggingface_hub, pyarrow, gradio,
# plotly). Don't fail the gate on their missing stubs / unknown member types —
# this repo's own code is what we type-check.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:huggingface_hub.*",
    "ignore::DeprecationWarning:jsonschema.*",
]

[tool.coverage.run]
branch = true
source = ["mlx_benchmarks"]

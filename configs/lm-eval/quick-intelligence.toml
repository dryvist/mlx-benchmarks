# Fast leaderboard MMLU-Pro evaluation; the survey selects the serving target
# and registry model. `context_list` maps to the server-side max_length setting.
# Never add a suite whose best reported open-weight score is >= 90% (see configs/nvidia/quality.toml exclusions).
# --limit 20 on its single subtask evaluates 20 items total.
config_name = "lm-eval/quick-intelligence"
engines = ["llama_cpp", "vllm", "mlx_lm"]
concurrency_list = [1, 2, 4, 8]
context_list = [32768, 65536, 131072]
power_cap_w = "inventory"

[[run]]
name = "mmlu-pro-quick"
executable = "lm_eval"
argv = [
  "--model", "local-completions",
  "--model_args", "base_url={{ benchmark_endpoint }}/completions,model={{ model_id }},num_concurrent={{ concurrency }},max_length={{ context }},timeout=3600",
  "--tasks", "leaderboard_mmlu_pro",
  "--batch_size", "1",
  "--limit", "20",
  "--log_samples",
  "--output_path", "{{ output_path }}",
]
dimensions = ["context_list", "concurrency_list"]
repetitions = 2 # Short suite; repeat to check score stability.
artifact_id = "selected_model"
run_on = "benchmark_target"
capture_stdout = true
converter = { executable = "mlx-bench-publish", kind = "lm-eval", suite = "knowledge", run_on = "controller" }
output_tokens = 4096

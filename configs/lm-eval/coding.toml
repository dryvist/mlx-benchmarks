# MBPP code-generation evaluation through a run-time OpenAI-compatible endpoint.
config_name = "lm-eval/coding"
engines = ["llama_cpp", "vllm", "mlx_lm"]
concurrency_list = [1, 2, 4, 8]
context_list = [8192]
power_cap_w = "inventory"

[[run]]
name = "mbpp-code-generation"
executable = "lm_eval"
argv = [
  "--model", "local-chat-completions",
  "--model_args", "base_url={{ benchmark_endpoint }}/chat/completions,model={{ serving_model }},tokenizer={{ model_id }},max_length={{ context }},num_concurrent={{ concurrency }},timeout=3600",
  "--tasks", "mbpp",
  "--batch_size", "1",
  "--num_fewshot", "3",
  "--limit", "100",
  "--apply_chat_template",
  "--fewshot_as_multiturn",
  "--gen_kwargs", "max_gen_toks={{ output_tokens }}",
  "--confirm_run_unsafe_code",
  "--log_samples",
  "--output_path", "{{ output_path }}",
]
dimensions = ["context_list", "concurrency_list"]
repetitions = 1
artifact_id = "selected_model"
run_on = "controller"
capture_stdout = false
converter = { executable = "mlx-bench-publish", kind = "lm-eval", suite = "coding", run_on = "controller" }
output_tokens = 1024
api_key_env = "OPENAI_API_KEY"
code_eval = true

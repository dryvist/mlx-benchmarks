# factual / grounded-summary — does the model invent numbers?
#
# Unlike the lm-eval/vllm suites, the runner lives IN this repo:
# harness/factual/run.py (standalone PEP 723 script, run via `uv run`).
# See docs/shootout.md for what it measures and how it is scored.

[run]
# 5 cases x 5 repeats x 2 thinking modes = 50 scored responses, plus 2 untimed
# warm-ups. Minutes, not hours — this suite is cheap next to agentic.
command = """
uv run harness/factual/run.py \
  --base-url http://127.0.0.1:11434/v1 \
  --api-key-env OPENAI_API_KEY \
  --model $MODEL \
  --fixtures configs/factual/fixtures/homelab-digest.json \
  --output run-output/factual_$MODEL_SLUG.json
"""

[run.smoke]
# One pass over the bank at thinking off — confirms the endpoint and the
# fixture path before committing to the full run.
command = """
uv run harness/factual/run.py \
  --base-url http://127.0.0.1:11434/v1 \
  --api-key-env OPENAI_API_KEY \
  --model $MODEL \
  --thinking off --repeats 1
"""

[matrix]
thinking = ["on", "off"]
repeats = 5
n_cases = 5
fixture_bank_version = "1"
# Single request in flight. Factual grounding is a single-turn property, and
# holding concurrency at 1 keeps latency comparable with the agentic conc1 cells.
concurrency = 1

[thinking_kwarg]
# Per-family thinking toggle passed via --thinking-kwarg.
default = "enable_thinking"      # Qwen3.x / GLM / most families via chat_template_kwargs
harmony = "reasoning_effort"     # gpt-oss (high = on, low = off-analog)

[scoring]
# Every check is deterministic; no model-graded assertion anywhere.
fact_recall = "every required_facts entry appears (case-insensitive, or as a normalized number)"
fabricated_numbers = "numbers in the response absent from evidence + prompt + allowed_derived"
forbidden_claims = "any forbidden_facts string appears — the plausible-but-wrong answers"
tool_syntax_leak = "raw tool-call syntax surfaced in prose that should carry none"
grounded_accuracy = "share of responses passing all four checks"

[publish]
command = """
mlx-bench-publish run-output/factual_$MODEL_SLUG.json \
  --kind factual --suite grounded-summary
"""

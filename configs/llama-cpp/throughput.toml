# OpenAI-compatible llama.cpp serving throughput. The campaign selects the
# endpoint and model; this recipe measures each prompt/concurrency cell only.
config_name = "llama-cpp/throughput"
engines = ["llama_cpp"]
concurrency_list = [1, 2, 4, 8]
context_list = [25, 8192, 32768, 65536, 131072]
power_cap_w = "inventory"

[[run]]
name = "serving-throughput"
executable = "uv"
argv = [
  "run", "harness/throughput/run.py",
  "--base-url", "{{ benchmark_endpoint }}",
  "--model", "{{ model_id }}",
  "--target-prompt-tokens", "{{ context }}",
  "--window-limit-tokens", "{{ context_window_tokens }}",
  "--max-tokens", "{{ output_tokens }}",
  "--repeats", "4",
  "--concurrency", "{{ concurrency }}",
  "--initial-model-state", "resident",
  "--output", "{{ result_path }}",
]
dimensions = ["context_list", "concurrency_list"]
repetitions = 1
artifact_id = "selected_model"
run_on = "controller"
capture_stdout = true
converter = { executable = "mlx-bench-publish", kind = "throughput-probe", suite = "throughput", run_on = "controller" }
output_tokens = 512

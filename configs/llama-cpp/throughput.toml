# llama.cpp / Vulkan throughput + speculative-decoding A/B runbook.
#
# Same in-repo runner as every other throughput target — harness/throughput/run.py
# speaks plain OpenAI-compatible /v1/chat/completions, so nothing here is
# llama.cpp-specific in mechanism, only in which endpoint it points at. This
# runbook documents a second target: an NVIDIA/Vulkan guest running
# llama-server, alongside the default local MLX/vllm-mlx endpoint.
#
# $LLAMA_CPP_HOST — set to the guest's base URL, e.g.
#   export LLAMA_CPP_HOST="http://llm-4080.$HOMELAB_APEX_DOMAIN:10434/v1"
# Never hardcode the apex domain here — it stays an env var so this file
# carries no real hostname.
#
# --draft-model/--spec-type/--baseline-json are run METADATA only: they do
# not start or configure llama-server. Set the target model and draft model
# on the server out-of-band before running, same as --model everywhere else
# in this repo.

[run]
# Baseline: no draft model. Run this first — its output feeds --baseline-json
# for every spec-decode candidate below.
command = """
uv run harness/throughput/run.py \
  --base-url $LLAMA_CPP_HOST \
  --model $MODEL \
  --spec-type none \
  --output run-output/throughput_llamacpp_$MODEL_SLUG-baseline.json
"""

[run.smoke]
command = """
uv run harness/throughput/run.py \
  --base-url $LLAMA_CPP_HOST \
  --model $MODEL \
  --repeats 1 --skip-concurrent \
  --spec-type none \
  --output run-output/throughput_llamacpp_$MODEL_SLUG-smoke.json
"""

# Draft-candidate sweep (task: "does spec decoding help at all, and should a
# bigger tiny model be used instead"). Run the baseline above once, then this
# command once per row below, swapping the server's configured draft model
# between invocations — the runner has no server-control mechanism, so this
# is a documented sequence, not a script.
[run.spec-decode]
command = """
uv run harness/throughput/run.py \
  --base-url $LLAMA_CPP_HOST \
  --model $MODEL \
  --draft-model $DRAFT_MODEL \
  --spec-type $SPEC_TYPE \
  --baseline-json run-output/throughput_llamacpp_$MODEL_SLUG-baseline.json \
  --output run-output/throughput_llamacpp_$MODEL_SLUG-$SPEC_TYPE.json
"""

# Candidate draft configs for the sweep above — fill in real model ids/paths
# before running. One row = one $DRAFT_MODEL/$SPEC_TYPE pair for run.spec-decode.
[[candidates]]
label = "small-draft-simple"
spec_type = "draft-simple"
note = "smallest available draft model for the target — cheapest, lowest expected acceptance rate"

[[candidates]]
label = "large-draft-simple"
spec_type = "draft-simple"
note = "larger draft model for the same target — trades draft cost for a higher acceptance rate"

[[candidates]]
label = "eagle3-or-mtp-head"
spec_type = "draft-eagle3"
note = "only if an EAGLE3/MTP head exists for the target model; drop this row otherwise"

[publish]
command = """
mlx-bench-publish run-output/throughput_llamacpp_$MODEL_SLUG-$VARIANT.json \
  --kind throughput-probe --suite throughput --hostname llm-4080
"""

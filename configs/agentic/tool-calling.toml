# agentic / tool-calling — many-tool tool-call reliability runbook.
#
# Unlike the lm-eval/vllm suites, the runner lives IN this repo:
# harness/agentic/run.py (standalone PEP 723 script, run via `uv run`).
# See docs/agentic.md for what it measures and the pass gate.

[run]
# Full matrix (the defaults): 2 concurrency x 2 thinking x 2 context x
# 2 stream = 16 cells x 10 repeats, plus the 20-round multi-turn track at
# thinking on+off. Hours on slow models — smoke first with --cells.
command = """
uv run harness/agentic/run.py \
  --base-url http://localhost:11434/v1 \
  --api-key-env OPENAI_API_KEY \
  --model $MODEL \
  --output run-output/agentic_$MODEL_SLUG.json
"""

[run.smoke]
# Minutes, not hours: only the goal-gate cell at 3 repeats, no multi-turn.
command = """
uv run harness/agentic/run.py \
  --base-url http://localhost:11434/v1 \
  --api-key-env OPENAI_API_KEY \
  --model $MODEL \
  --cells conc4_think-on_ctx-large_stream \
  --repeats 3
"""

[matrix]
concurrency = [1, 4]
thinking = ["on", "off"]
context = ["small", "large"]     # small ~1K, large ~20K synthetic tool-result history
stream = ["stream", "nostream"]
repeats = 10
multiturn_rounds = 20
n_tools = 22

[thinking_kwarg]
# Per-family thinking toggle passed via --thinking-kwarg.
default = "enable_thinking"      # Qwen3.x / GLM via chat_template_kwargs
harmony = "reasoning_effort"     # gpt-oss (high = on, low = off-analog)

[publish]
command = """
mlx-bench-publish run-output/agentic_$MODEL_SLUG.json \
  --kind agentic --suite tool-calling
"""

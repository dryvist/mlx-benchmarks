# promptstack — system prompt as the independent variable.
#
# Unlike the other suites, the runner lives IN this repo:
# harness/promptstack/run.py (standalone PEP 723 script, run via `uv run`).
# See docs/promptstack.md for what it measures and the adoption rule.

[run]
# Full matrix: 2 prompt variants x 2 thinking x 4 probe classes x 10 repeats
# per task. Minutes, not hours (small deterministic banks) — but never
# against a busy Studio without asking.
command = """
uv run harness/promptstack/run.py \
  --base-url http://localhost:11434/v1 \
  --api-key-env OPENAI_API_KEY \
  --model $MODEL \
  --prompt-set configs/promptstack/prompts/ \
  --probe-bank configs/promptstack/probes/ \
  --surface hermes \
  --output run-output/promptstack_$MODEL_SLUG.json
"""

[run.smoke]
command = """
uv run harness/promptstack/run.py \
  --base-url http://localhost:11434/v1 \
  --api-key-env OPENAI_API_KEY \
  --model $MODEL \
  --prompt-set configs/promptstack/prompts/ \
  --probe-bank configs/promptstack/probes/ \
  --surface hermes \
  --cells variant-base_plus_variant_think-on \
  --repeats 2
"""

[matrix]
prompt_variant = ["base_plus_variant", "current"]
thinking       = ["on", "off"]
concurrency    = [1]        # promptstack is correctness, not throughput — keep conc low
repeats        = 10          # verdict-policy: consecutive-pair minimum; 10 for a rate

[surfaces]
# --surface value -> which <name>.txt / current-<name>.txt pair to load.
hermes = "hermes_agent role -> Hermes MEMORY.md override"
chat = "open_webui role default prompt"

[publish]
command = """
mlx-bench-publish run-output/promptstack_$MODEL_SLUG.json \
  --kind promptstack --suite promptstack
"""

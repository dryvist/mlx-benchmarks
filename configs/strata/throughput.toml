# OpenAI-compatible Strata serving throughput. Batch slots are configured on
# the target before each campaign; each row is a fixed prompt/output shape.
config_name = "strata/throughput"
engines = ["strata"]
concurrency_list = [1, 2, 4, 6, 8]
context_list = [25, 1024, 4096]
power_cap_w = "inventory"

[[run]]
name = "short-25-512-64k"
executable = "uv"
argv = [
  "run", "harness/throughput/run.py",
  "--base-url", "{{ benchmark_endpoint }}",
  "--model", "{{ model_id }}",
  "--target-prompt-tokens", "{{ context }}",
  "--window-limit-tokens", "{{ context_window_tokens }}",
  "--max-tokens", "{{ output_tokens }}",
  "--repeats", "4",
  "--concurrency", "{{ concurrency }}",
  "--initial-model-state", "resident",
  "--output", "{{ result_path }}",
]
prompt_tokens = 25
dimensions = ["concurrency_list"]
repetitions = 1
artifact_id = "selected_model"
run_on = "controller"
capture_stdout = true
converter = { executable = "mlx-bench-publish", kind = "throughput-probe", suite = "throughput", run_on = "controller" }
output_tokens = 512


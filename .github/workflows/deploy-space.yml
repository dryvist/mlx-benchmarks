name: deploy-space

on:
  push:
    branches: [main]
    paths:
      - space/**
      - metadata/run-index-v1.json
      - dataset-card/README.md
      - scripts/normalize_dataset_schema.py
      - src/mlx_benchmarks/dataset_schema.py
      - src/mlx_benchmarks/publish.py
      - .github/workflows/deploy-space.yml
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-space
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: huggingface-space
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install dataset publisher
        run: >-
          python -m pip install --no-cache-dir -e .
          "huggingface_hub[cli]>=1.28.0"
          "pyarrow>=25.0.1"

      - name: Normalize canonical dataset shards
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_WRITE_ALL }}
          MACHINE_LABELS_JSON: ${{ secrets.MLX_BENCHMARKS_MACHINE_LABELS_JSON || secrets.MACHINE_LABELS_JSON }}
        run: python scripts/normalize_dataset_schema.py --apply

      - name: Upload canonical run index
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_WRITE_ALL }}
          GIT_SHA: ${{ github.sha }}
        run: |
          hf upload JacobPEvans/mlx-benchmarks metadata/run-index-v1.json metadata/run-index-v1.json \
            --repo-type=dataset \
            --commit-message="Publish run index from ${GIT_SHA}"

      - name: Upload space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_WRITE_ALL }}
          GIT_SHA: ${{ github.sha }}
        run: |
          hf upload JacobPEvans/mlx-benchmarks-viewer ./space . \
            --repo-type=space \
            --commit-message="Deploy from ${GIT_SHA}" \
            --exclude=".venv/**" \
            --exclude="__pycache__/**" \
            --exclude=".pytest_cache/**" \
            --exclude=".ruff_cache/**" \
            --exclude=".mypy_cache/**" \
            --exclude="tests/**"

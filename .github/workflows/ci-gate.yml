# CI Gate — thin wrapper over the dryvist org reusable workflows
#
# The standard checks (ruff lint/format, pyright type-check, pytest, zizmor,
# markdown lint, file size) are delegated to the org orchestrator
# `dryvist/.github/.github/workflows/_ci-gate.yml@main`. This repo carries NO
# `run:` lint config of its own for those — pyproject.toml + .pre-commit-config
# are the single source the org `_python-ci.yml` consumes via `uv run pre-commit`.
#
# Genuinely repo-specific checks that the org gate does NOT cover are preserved
# here as bespoke sibling jobs and folded into a single `Merge Gate`:
#
#   python-security    -> org `_python-security.yml` (pip-audit dependency scan).
#   osv-scan           -> org `_osv-scan.yml`; the org `_ci-gate.yml` has no OSV
#                         toggle at all.
#   schema-validate    -> validates schema.json + TOML configs (repo-specific).
#   space-viewer-test  -> pytest over `space/tests`; `_python-ci.yml` runs
#                         `pytest` which honours pyproject `testpaths=["tests"]`,
#                         so the space viewer suite is otherwise never run.
#   dry-run-publish    -> builds the wheel and exercises the HF publisher CLI.
#
# To add a STANDARD check, prefer enabling a toggle on the org `_ci-gate.yml`
# call below. Add a bespoke job only when the org gate genuinely cannot cover it.

name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ============================================================================
  # CHANGE DETECTION — drives the bespoke jobs below. (The org `_ci-gate.yml`
  # runs its own paths-filter internally for the standard checks.)
  # ============================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      schema: ${{ steps.filter.outputs.schema }}
      publisher: ${{ steps.filter.outputs.publisher }}
      space: ${{ steps.filter.outputs.space }}
      lockfile: ${{ steps.filter.outputs.lockfile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            schema:
              - 'schema.json'
              - 'configs/**'
              - 'scripts/validate_schema.py'
            publisher:
              - 'src/mlx_benchmarks/**'
              - 'schema.json'
              - 'tests/fixtures/**'
              - 'pyproject.toml'
            space:
              - 'space/**'
              - 'src/mlx_benchmarks/**'
              - 'pyproject.toml'
              - 'uv.lock'
            lockfile:
              - 'uv.lock'
              - 'pyproject.toml'

  # ============================================================================
  # STANDARD CHECKS — delegated to the org orchestrator. This covers ruff
  # lint/format, pyright type-check, pytest (the `tests/` suite across the
  # py3.13-only matrix), zizmor, markdown lint, and file size.
  # ============================================================================
  standard-ci:
    name: Standard CI
    permissions:
      contents: read
      pull-requests: read
      # The org gate's queue watchdog cancels stuck sibling jobs via the
      # Actions API; a called workflow can never exceed the caller's grant, so
      # `actions: write` must be granted here or the run fails at graph
      # validation (startup_failure).
      actions: write
    uses: dryvist/.github/.github/workflows/_ci-gate.yml@main
    with:
      python_ci: true
      # Floor is 3.13; CI additionally validates 3.14 (stable since 2025-10).
      python_ci_versions: '["3.13", "3.14"]'
      filters: |
        python:
          - 'src/**'
          - 'scripts/**'
          - 'space/**'
          - 'tests/**'
          - 'pyproject.toml'
          - 'uv.lock'
          - '.pre-commit-config.yaml'
          - '.github/workflows/ci-gate.yml'
        markdown:
          - '**.md'
          - '.markdownlint*'

  # ============================================================================
  # BESPOKE CHECKS — not covered by the org gate (see header).
  # ============================================================================
  python-security:
    name: Python Security
    needs: changes
    if: needs.changes.outputs.lockfile == 'true'
    uses: dryvist/.github/.github/workflows/_python-security.yml@main
    with:
      python-dirs: "."

  osv-scan:
    name: OSV Scan
    needs: changes
    # Always run — new advisories can land against unchanged dependencies, so
    # scan on every PR regardless of whether the lockfile changed.
    if: always()
    uses: dryvist/.github/.github/workflows/_osv-scan.yml@main
    permissions:
      actions: read
      contents: read
      security-events: write

  schema-validate:
    name: Schema Validate
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install validator deps
        run: python -m pip install --no-cache-dir "jsonschema[format]>=4.23.0"
      - name: Validate schema + TOML configs
        run: python scripts/validate_schema.py

  space-viewer-test:
    name: Space Viewer Test
    needs: changes
    if: needs.changes.outputs.space == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install project + viewer + dev dependencies
        run: |
          uv venv --python 3.13
          uv pip install -e .
          uv pip install -r space/requirements.txt
          uv pip install pytest pytest-cov
      - name: Pytest (space viewer)
        run: .venv/bin/pytest space/tests

  dry-run-publish:
    name: Dry-run publish
    needs: changes
    if: needs.changes.outputs.publisher == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Build wheel
        run: |
          uv venv .venv-build --python 3.13
          uv pip install --python .venv-build/bin/python build
          .venv-build/bin/python -m build --wheel --outdir dist/
      - name: Install built wheel in a clean venv
        run: |
          uv venv .venv-install --python 3.13
          uv pip install --python .venv-install/bin/python dist/*.whl
      - name: Dry-run publish against canonical fixture
        run: |
          .venv-install/bin/mlx-bench-publish \
            tests/fixtures/lm_eval_results_sample.json \
            --kind lm-eval \
            --suite reasoning \
            --git-sha "${COMMIT_SHA:0:7}" \
            --dry-run

  # ============================================================================
  # MERGE GATE — aggregates the org standard gate plus the bespoke jobs. This
  # is the single check branch protection should require. (The org reusable
  # surfaces its own internal "Standard CI / Merge Gate"; this outer gate only
  # needs the caller job, which already reflects that result.)
  # ============================================================================
  gate:
    name: Merge Gate
    needs:
      - changes
      - standard-ci
      - python-security
      - osv-scan
      - schema-validate
      - space-viewer-test
      - dry-run-publish
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check all results
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          allowed-skips: python-security, osv-scan, schema-validate, space-viewer-test, dry-run-publish
          jobs: ${{ toJSON(needs) }}

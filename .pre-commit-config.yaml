repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        # lm-eval task configs (configs/lm-eval/qwen3-tasks/*.yaml) use
        # custom !function tags. --unsafe runs a syntax-only check that
        # accepts custom tags while still validating YAML structure.
        args: [--unsafe]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: '^(uv\.lock|.*\.parquet)$'
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      # `ruff-check` is the current lint hook id; bare `ruff` is a legacy alias.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.4
    hooks:
      - id: actionlint

  # pyright + pytest run from the project venv so pyproject.toml dev-deps are the
  # SINGLE version authority (no rev pin to drift). pyright is the org-mandated
  # type checker (replaced mypy 2026-06). pytest is gated at PUSH, not commit, to
  # keep the commit cycle fast; CI runs the full suite.
  - repo: local
    hooks:
      - id: validate-benchmark-results
        name: validate published benchmark result rows
        entry: .venv/bin/mlx-bench-validate-results
        language: system
        pass_filenames: true
        types: [file]
        files: '(^|/)(eval|results?)/.*\.(json|jsonl|parquet)$'
      - id: pyright
        name: pyright (type check, from .venv)
        entry: .venv/bin/pyright
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest (from .venv, pre-push only)
        entry: .venv/bin/pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

default_language_version:
  python: python3

ci:
  autoupdate_schedule: monthly
